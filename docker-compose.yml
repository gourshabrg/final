services:

  # ==========================================================
  # POSTGRES
  # ==========================================================
  postgres:
    image: postgres:13
    container_name: lumi-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
      TZ: UTC

    command: ["postgres", "-c", "timezone=UTC"]

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5


  # ==========================================================
  # AIRFLOW INIT
  # ==========================================================
  airflow-init:
    build:
      context: .
      dockerfile: airflow/Dockerfile

    container_name: lumi-airflow-init

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
        postgresql+psycopg2://airflow:airflow@postgres:5432/airflow

      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

      AIRFLOW__WEBSERVER__SECRET_KEY: change-me-local-only

      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth

      _PIP_ADDITIONAL_REQUIREMENTS: ""

    user: "0:0"

    volumes:
      # Airflow DAGs, logs and plugins
      - ./airflow:/opt/airflow

      # Application data
      - ./data:/opt/lumi/data

      # Control files
      - ./control-files:/opt/lumi/control-files

      # PySpark jobs
      - ./pyspark:/opt/lumi/pyspark

      # Apache Beam JAR
      - ./beam-ingestion/target:/opt/lumi/beam

    command:
      - bash
      - -c
      - |
        mkdir -p /opt/airflow/dags
        mkdir -p /opt/airflow/logs
        mkdir -p /opt/airflow/plugins

        mkdir -p /opt/lumi/data
        mkdir -p /opt/lumi/control-files
        mkdir -p /opt/lumi/pyspark
        mkdir -p /opt/lumi/beam

        chown -R airflow:root /opt/airflow/logs
        chown -R airflow:root /opt/lumi

        airflow db migrate

        airflow users create \
          --username airflow \
          --password airflow \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com \
          || true


  # ==========================================================
  # AIRFLOW WEBSERVER
  # ==========================================================
  airflow-webserver:
    build:
      context: .
      dockerfile: airflow/Dockerfile

    container_name: lumi-airflow-webserver

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
        postgresql+psycopg2://airflow:airflow@postgres:5432/airflow

      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

      AIRFLOW__WEBSERVER__SECRET_KEY: change-me-local-only

      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth

    ports:
      - "8082:8080"

    volumes:
      # Airflow DAGs, logs and plugins
      - ./airflow:/opt/airflow

      # Application data
      - ./data:/opt/lumi/data

      # Control files
      - ./control-files:/opt/lumi/control-files

      # PySpark jobs
      - ./pyspark:/opt/lumi/pyspark

      # Apache Beam JAR
      - ./beam-ingestion/target:/opt/lumi/beam

    command: webserver


  # ==========================================================
  # AIRFLOW SCHEDULER
  # ==========================================================
  airflow-scheduler:
    build:
      context: .
      dockerfile: airflow/Dockerfile

    container_name: lumi-airflow-scheduler

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    environment:
      LUMI_ENCRYPTION_KEY: ${LUMI_ENCRYPTION_KEY}

      AIRFLOW__CORE__EXECUTOR: LocalExecutor

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
        postgresql+psycopg2://airflow:airflow@postgres:5432/airflow

      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

      AIRFLOW__WEBSERVER__SECRET_KEY: change-me-local-only

      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth

    volumes:
      # Airflow DAGs, logs and plugins
      - ./airflow:/opt/airflow

      # Application data
      - ./data:/opt/lumi/data

      # Control files
      - ./control-files:/opt/lumi/control-files

      # PySpark jobs
      - ./pyspark:/opt/lumi/pyspark

      # Apache Beam JAR
      - ./beam-ingestion/target:/opt/lumi/beam

    command: scheduler


volumes:

  postgres-data:
