# Local platform: PostgreSQL (Airflow metadata + warehouse) and Airflow (webserver + scheduler).
# The Spring Boot API runs on the host and calls Airflow on http://localhost:8082.

# Settings shared by every Airflow container (YAML anchor, reused with <<: *airflow-common).
x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: airflow/Dockerfile
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__SECRET_KEY: change-me-local-only
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
    # New DAGs start un-paused so the first API call works without clicking in the UI.
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    # Connection used by the check_execution_status task.
    AIRFLOW_CONN_LUMI_WAREHOUSE: postgres://airflow:airflow@postgres:5432/warehouse
    # Used by the Beam job.
    LUMI_ENCRYPTION_KEY: ${LUMI_ENCRYPTION_KEY:?Set LUMI_ENCRYPTION_KEY in .env}
    LUMI_WAREHOUSE_JDBC_URL: jdbc:postgresql://postgres:5432/warehouse
    LUMI_WAREHOUSE_USERNAME: airflow
    LUMI_WAREHOUSE_PASSWORD: airflow
  volumes:
    - ./airflow:/opt/airflow                      # DAGs, scripts, logs
    - ./data:/opt/lumi/data                       # input, split and error files
    - ./control-files:/opt/lumi/control-files     # control files
    - ./pyspark:/opt/lumi/pyspark                 # PySpark split job
    - ./beam-ingestion/target:/opt/lumi/beam      # Beam JAR
  depends_on:
    postgres:
      condition: service_healthy

services:

  postgres:
    image: postgres:13
    container_name: lumi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
      TZ: UTC
    command: ["postgres", "-c", "timezone=UTC"]
    ports:
      # Change POSTGRES_HOST_PORT in .env if another PostgreSQL already uses 5432 on your machine.
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d   # creates the warehouse on first start
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-off job: creates Airflow tables and the admin user, then exits.
  airflow-init:
    <<: *airflow-common
    container_name: lumi-airflow-init
    user: "0:0"
    command:
      - bash
      - -c
      - |
        mkdir -p /opt/airflow/logs /opt/lumi/data/split /opt/lumi/data/error
        chown -R airflow:root /opt/airflow/logs /opt/lumi/data
        airflow db migrate
        airflow users create --username airflow --password airflow \
          --firstname Admin --lastname User --role Admin --email admin@example.com || true

  airflow-webserver:
    <<: *airflow-common
    container_name: lumi-airflow-webserver
    restart: unless-stopped
    command: webserver
    ports:
      - "8082:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: lumi-airflow-scheduler
    restart: unless-stopped
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-data:
